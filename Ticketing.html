<!doctype html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatolian Warriors 2026 - Bilet Satışı</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: '#D4AF37', 'gold-dark': '#B8960C', obsidian: '#0A0A0A', charcoal: '#1A1A1A', slate: '#2A2A2A' },
          fontFamily: { oswald: ['Oswald', 'sans-serif'], barlow: ['Barlow', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    .app-root { height: 100%; overflow-y: auto; overflow-x: hidden; }
    @keyframes pulse-gold { 0%,100%{box-shadow:0 0 20px rgba(212,175,55,0.3)} 50%{box-shadow:0 0 40px rgba(212,175,55,0.6)} }
    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    .pulse-gold { animation: pulse-gold 2s infinite; }
    .shimmer { background: linear-gradient(90deg, transparent, rgba(212,175,55,0.1), transparent); background-size: 200% 100%; animation: shimmer 3s infinite; }
    .hero-bg { background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 70%); position: relative; overflow: hidden; }
    .hero-bg::before { content:''; position:absolute; inset:0; background: repeating-conic-gradient(rgba(212,175,55,0.02) 0% 25%, transparent 0% 50%) 0 0/80px 80px; }
    .ticket-card { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
    .ticket-card:hover:not(.sold-out) { transform: translateY(-4px); }
    .ticket-card.selected { border-color: #D4AF37; box-shadow: 0 0 30px rgba(212,175,55,0.2); }
    .section-divider { height:1px; background: linear-gradient(90deg, transparent, #D4AF37, transparent); }
    .cta-btn { background: linear-gradient(135deg, #D4AF37, #B8960C); transition: all 0.3s; }
    .cta-btn:hover:not(:disabled) { background: linear-gradient(135deg, #e6c34a, #D4AF37); transform: scale(1.02); }
  </style>
</head>
<body class="h-full bg-obsidian text-white font-barlow">
  <div class="app-root" id="app-root">
    <header class="fixed top-0 w-full z-50 bg-obsidian/95 backdrop-blur-md border-b border-gold/10">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <a id="main-title" href="/"><div class="font-oswald text-xl md:text-2xl font-bold tracking-wider"><span class="text-gold">ANATOLIAN</span> <span class="text-white">WARRIORS</span></div></a>
        <button id="lang-toggle" class="px-3 py-1 border border-gold/40 rounded text-xs font-semibold text-gold hover:bg-gold/10 transition">TR | EN</button>
      </div>
    </header>

    <section class="hero-bg min-h-[600px] flex items-center justify-center text-center px-4 pt-20 pb-16 relative">
      <div class="relative z-10 max-w-4xl mx-auto">
        <div class="inline-block px-4 py-1 border border-gold/40 rounded-full text-gold text-xs font-semibold tracking-widest mb-6 shimmer">24-29 AUGUST 2026</div>
        <a id="main-title" href="/"><h1 class="font-oswald text-5xl md:text-7xl lg:text-8xl font-bold tracking-tight leading-none mb-4"><span class="text-white">ANATOLIAN</span><br><span class="text-gold">WARRIORS</span> <span class="text-white">2026</span></h1></a>
        <p id="hero-subtitle" class="text-lg md:text-xl text-gray-300 font-light mb-8 max-w-2xl mx-auto"></p>
        <a href="#tickets" class="cta-btn inline-block px-10 py-4 rounded-lg font-oswald text-lg font-bold text-obsidian tracking-wider pulse-gold" data-i18n="buy_tickets">BİLET AL</a>
      </div>
    </section>

    <div class="section-divider"></div>

    <section id="tickets" class="py-20 px-4 bg-obsidian">
      <div class="max-w-6xl mx-auto">
        <h2 class="font-oswald text-3xl md:text-5xl font-bold text-center mb-3"><span class="text-gold" data-i18n="select_tickets"></span></h2>
        <p class="text-center text-gray-400 mb-4" data-i18n="ticket_desc"></p>
        
        <div class="text-center mb-12">
          <div class="inline-block bg-charcoal border border-gold/20 rounded-lg px-5 py-3">
            <span class="text-gold font-semibold" data-i18n="price_first">1. Kişi: 2.800 ₺</span> <span class="mx-3 text-gray-600">|</span> <span class="text-green-400 font-semibold" data-i18n="price_next">Sonraki Kişiler: 2.000 ₺</span>
          </div>
        </div>

        <div id="loading-capacity" class="text-center text-gold text-sm font-semibold mb-6"><span data-i18n="loading_days">Güncel doluluk oranları kontrol ediliyor...</span></div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 md:gap-4 mb-12" id="day-cards"></div>

        <div id="ticket-summary" class="hidden">
          <div class="max-w-lg mx-auto bg-charcoal border border-gold/20 rounded-xl p-6 md:p-8">
            <h3 class="font-oswald text-xl text-gold mb-4" data-i18n="order_summary"></h3>
            <div class="flex items-center justify-between mb-4">
              <span class="text-gray-300" data-i18n="quantity"></span>
              <div class="flex items-center gap-3">
                <button id="qty-minus" class="w-9 h-9 rounded-full border border-gold/40 text-gold flex items-center justify-center hover:bg-gold/10 font-bold">−</button>
                <span id="qty-display" class="font-oswald text-2xl text-white w-8 text-center">1</span>
                <button id="qty-plus" class="w-9 h-9 rounded-full border border-gold/40 text-gold flex items-center justify-center hover:bg-gold/10 font-bold">+</button>
              </div>
            </div>
            <div class="border-t border-gray-700 pt-4 space-y-2">
              <div class="flex justify-between text-sm text-gray-400"><span data-i18n="selected_day"></span><span id="sum-day" class="text-white">—</span></div>
              <div class="flex justify-between text-lg font-bold mt-2 pt-2 border-t border-gray-700"><span data-i18n="total"></span><span id="sum-total" class="text-gold">—</span></div>
            </div>
            <button id="proceed-btn" class="cta-btn w-full mt-6 py-4 rounded-lg font-oswald text-lg font-bold text-obsidian tracking-wider" data-i18n="proceed_checkout"></button>
          </div>
        </div>
      </div>
    </section>

    <div id="checkout-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
      <div class="bg-charcoal border border-gold/20 rounded-2xl w-full max-w-lg p-6 md:p-8 relative">
        <button id="close-checkout" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
        <h3 class="font-oswald text-2xl text-gold mb-6" data-i18n="checkout"></h3>
        
        <form id="checkout-form" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-gray-400 mb-1" data-i18n="first_name"></label>
              <input type="text" id="cust-first-name" required class="w-full bg-slate border border-gray-600 rounded-lg px-4 py-3 text-white focus:border-gold focus:outline-none">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1" data-i18n="last_name"></label>
              <input type="text" id="cust-last-name" required class="w-full bg-slate border border-gray-600 rounded-lg px-4 py-3 text-white focus:border-gold focus:outline-none">
            </div>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Email</label>
            <input type="email" id="cust-email" required class="w-full bg-slate border border-gray-600 rounded-lg px-4 py-3 text-white focus:border-gold focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1" data-i18n="phone"></label>
            <input type="tel" id="cust-phone" placeholder="+90555..." required class="w-full bg-slate border border-gray-600 rounded-lg px-4 py-3 text-white focus:border-gold focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1" data-i18n="country"></label>
            <select id="cust-country" required class="w-full bg-slate border border-gray-600 rounded-lg px-4 py-3 text-white focus:border-gold focus:outline-none">
              <option value="Turkey">Türkiye</option><option value="USA">USA</option><option value="Germany">Germany</option>
            </select>
          </div>
          <button type="submit" id="pay-submit-btn" class="cta-btn w-full py-4 rounded-lg font-oswald text-lg font-bold text-obsidian tracking-wider mt-4" data-i18n="proceed_payment"></button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // آدرس وب‌اپ گوگل اپ اسکریپت خود را پس از دیپلوی اینجا قرار دهید
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4LNwqZv9v6KukhFGeQHVfa-LNGoffJT02Gkw6twOhFmzAP5X0m5vDG2P5eHSc9pkbmg/exec";

    const i18n = {
      tr: {
        buy_tickets: 'BİLET AL', select_tickets: 'BİLETİNİ SEÇ', ticket_desc: 'Etkinlik gününü seç, miktarı belirle ve hemen satın al.',
        price_first: '1. Kişi: 2.800 ₺', price_next: 'Sonraki Kişiler: 2.000 ₺', order_summary: 'Sipariş Özeti', quantity: 'Adet', selected_day: 'Seçili Gün', total: 'Toplam',
        proceed_checkout: 'ÖDEMEYE GEÇ', checkout: 'Ödeme Bilgileri', first_name: 'Ad', last_name: 'Soyad', phone: 'Telefon', country: 'Ülke', proceed_payment: 'GÜVENLİ ÖDEME SAYFASINA GİT',
        subtitle: 'Dünyanın en heyecan verici yarışması şimdi İstanbul'da!', processing: 'Yönlendiriliyor...', loading_days: 'Güncel doluluk oranları kontrol ediliyor...',
        sold_out_msg: 'Seçilen gün için 6.000 kişilik bilet kapasitesi tamamen dolmuştur!', tag_sold_out: 'DOLDU'
      },
      en: {
        buy_tickets: 'BUY TICKETS', select_tickets: 'SELECT YOUR TICKETS', ticket_desc: 'Choose your event day, select quantity and purchase instantly.',
        price_first: '1st Person: 2,800 ₺', price_next: 'Next Persons: 2,000 ₺ each', order_summary: 'Order Summary', quantity: 'Quantity', selected_day: 'Selected Day', total: 'Total',
        proceed_checkout: 'PROCEED TO CHECKOUT', checkout: 'Checkout Details', first_name: 'First Name', last_name: 'Last Name', phone: 'Phone', country: 'Country', proceed_payment: 'GO TO SECURE PAYMENT PAGE',
        subtitle: 'The world's most exciting competition is now !', processing: 'Redirecting...', loading_days: 'Checking current availability...',
        sold_out_msg: 'The 6,000 ticket capacity for the selected day has been fully reached!', tag_sold_out: 'SOLD OUT'
      }
    };

    let lang = 'tr';
    const days = ['24','25','26','27','28','29'];
    let selectedDay = null;
    let quantity = 1;
    let soldOutDays = []; 

    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      document.getElementById('hero-subtitle').textContent = i18n[lang]['subtitle'];
      renderDayCards();
      updateSummary();
    }

    function fetchCapacities() {
      fetch(`${APPS_SCRIPT_URL}?action=check_all_capacities`)
        .then(res => res.json())
        .then(data => {
          if (data && data.soldOutDays) soldOutDays = data.soldOutDays.map(String);
          document.getElementById('loading-capacity').classList.add('hidden');
          renderDayCards();
        })
        .catch(() => {
          document.getElementById('loading-capacity').classList.add('hidden');
          renderDayCards();
        });
    }

    function renderDayCards() {
      const c = document.getElementById('day-cards');
      c.innerHTML = '';
      const months = lang === 'tr' ? 'Ağustos' : 'August';
      
      days.forEach(d => {
        const isSoldOut = soldOutDays.includes(d);
        const card = document.createElement('div');
        
        if (isSoldOut) {
          card.className = `ticket-card sold-out opacity-30 cursor-not-allowed rounded-xl border border-red-900 bg-red-950/20 p-4 text-center relative`;
          card.innerHTML = `
            <div class="font-oswald text-3xl font-bold text-gray-500 line-through">${d}</div>
            <div class="text-xs text-gray-600 mt-1">${months}</div>
            <div class="absolute inset-x-0 bottom-1 text-[10px] text-red-500 font-bold tracking-wider">${i18n[lang].tag_sold_out}</div>
          `;
          card.onclick = () => alert(i18n[lang].sold_out_msg);
        } else {
          card.className = `ticket-card cursor-pointer rounded-xl border ${selectedDay===d?'border-gold bg-gold/5 selected':'border-gray-700 bg-slate hover:border-gold/50'} p-4 text-center`;
          card.innerHTML = `<div class="font-oswald text-3xl font-bold ${selectedDay===d?'text-gold':'text-white'}">${d}</div><div class="text-xs text-gray-400 mt-1">${months}</div>`;
          card.onclick = () => { 
            selectedDay = d; 
            renderDayCards(); 
            document.getElementById('ticket-summary').classList.remove('hidden'); 
            updateSummary(); 
          };
        }
        c.appendChild(card);
      });
    }

    function calculateTotal() { return quantity <= 0 ? 0 : 2800 + (quantity - 1) * 2000; }

    function updateSummary() {
      if (!selectedDay) return;
      const months = lang === 'tr' ? 'Ağustos' : 'August';
      document.getElementById('qty-display').textContent = quantity;
      document.getElementById('sum-day').textContent = `${selectedDay} ${months} 2026`;
      document.getElementById('sum-total').textContent = `${calculateTotal().toLocaleString()} ₺`;
    }

    document.getElementById('qty-minus').onclick = () => { if(quantity > 1) { quantity--; updateSummary(); } };
    document.getElementById('qty-plus').onclick = () => { quantity++; updateSummary(); };
    document.getElementById('proceed-btn').onclick = () => document.getElementById('checkout-modal').classList.remove('hidden');
    document.getElementById('close-checkout').onclick = () => document.getElementById('checkout-modal').classList.add('hidden');
    document.getElementById('lang-toggle').onclick = () => { lang = lang === 'tr' ? 'en' : 'tr'; applyLang(); };

    document.getElementById('checkout-form').onsubmit = function(e) {
      e.preventDefault();
      const btn = document.getElementById('pay-submit-btn');
      btn.disabled = true;
      btn.textContent = i18n[lang].processing;

      const payload = {
        action: "initiate_payment",
        day: selectedDay,
        qty: quantity,
        firstName: document.getElementById('cust-first-name').value,
        lastName: document.getElementById('cust-last-name').value,
        email: document.getElementById('cust-email').value,
        phone: document.getElementById('cust-phone').value,
        country: document.getElementById('cust-country').value
      };

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "success" && response.paymentUrl) {
          window.location.href = response.paymentUrl;
        } else if (response.status === "sold_out") {
          alert(i18n[lang].sold_out_msg);
          location.reload();
        } else {
          alert("Iyzico Error: " + response.message);
          btn.disabled = false;
          btn.textContent = i18n[lang].proceed_payment;
        }
      })
      .catch(err => {
        console.error(err);
        alert("Bağlantı hatası oluştu.");
        btn.disabled = false;
        btn.textContent = i18n[lang].proceed_payment;
      });
    };

    applyLang();
    fetchCapacities();
    lucide.createIcons();
  </script>
</body>
</html>
