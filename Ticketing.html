    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang][key]) {
          if (i18n[lang][key].includes('<a')) {

    function fetchCapacities() {
      fetch(`${APPS_SCRIPT_URL}?action=check_all_capacities`)

          renderDayCards();
        })
        .catch(() => {
          document.getElementById('loading-capacity').classList.add('hidden');
          renderDayCards();
        });
    }

            <div class="font-oswald text-3xl font-bold text-gray-500 line-through">${d}</div>
            <div class="text-xs text-gray-600 mt-1">${months}</div>
            <div class="absolute inset-x-0 bottom-1 text-[10px] text-red-500 font-bold tracking-wider">${i18n[lang].tag_sold_out}</div>
          `;
          card.onclick = () => alert(i18n[lang].sold_out_msg);
        } else {
          card.className = `ticket-card cursor-pointer rounded-xl border ${selectedDay===d?'border-gold bg-gold/5 selected':'border-gray-700 bg-slate hover:border-gold/50'} p-4 pb-6 text-center relative`;
          card.innerHTML = `
            <div class="font-oswald text-3xl font-bold ${selectedDay===d?'text-gold':'text-white'}">${d}</div>
            <div class="text-xs text-gray-400 mt-1">${months}</div>
            <div class="absolute inset-x-0 bottom-1 text-[10px] text-amber-500 font-semibold tracking-wider animate-pulse">${i18n[lang].filling_fast}</div>
          `;
          card.onclick = () => { 
            selectedDay = d;
            renderDayCards(); 
            
            const summarySection = document.getElementById('ticket-summary');
            summarySection.classList.remove('hidden'); 
            updateSummary(); 
            
            // Smooth scroll directly to the summary block with layout buffer
            setTimeout(() => {
              summarySection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
          };
        }
        c.appendChild(card);
      });
    }

    function calculateTotal() { 
      if (quantity <= 0) return 0;
      let base = 2800 + (quantity - 1) * 2000;
      if (activeDiscount.rate > 0) {
        base = base * (1 - (activeDiscount.rate / 100));
      }
      return base;
    }

    function updateSummary() {
      if (!selectedDay) return;
      const months = lang === 'tr' ? 'Ağustos' : 'August';
      document.getElementById('qty-display').textContent = quantity;
      document.getElementById('sum-day').textContent = `${selectedDay} ${months} 2026`;
      
      const discRow = document.getElementById('discount-row');
      const discSum = document.getElementById('sum-discount');
      if (activeDiscount.rate > 0) {
        discRow.classList.remove('hidden');
        discSum.textContent = `-%${activeDiscount.rate}`;
      } else {
        discRow.classList.add('hidden');
      }
      
      document.getElementById('sum-total').textContent = `${calculateTotal().toLocaleString()} ₺`;
    }

    // Live Notification Module
    function initLiveNotifications() {
      const scheduleNext = () => {
        // Runs approx every 5 seconds (randomized between 4000ms and 6000ms)
        const randTime = Math.floor(Math.random() * (6000 - 4000 + 1)) + 4000; 
        setTimeout(() => {
          triggerNotification();
          scheduleNext();
        }, randTime);
      };
      scheduleNext();
    }

    function triggerNotification() {
      const availableDays = days.filter(d => !soldOutDays.includes(d));
      if (availableDays.length === 0) return;

      const namesList = lang === 'tr' ? mockNamesTR : mockNamesEN;
      const randomName = namesList[Math.floor(Math.random() * namesList.length)];
      const randomDay = availableDays[Math.floor(Math.random() * availableDays.length)];
      const randomQty = Math.floor(Math.random() * 5) + 1;
      const months = lang === 'tr' ? 'Ağustos' : 'August';

      let noticeMarkup = "";
      if (lang === 'tr') {
        noticeMarkup = `<strong>${randomName}</strong>, ${randomDay} ${months} günü için <strong>${randomQty} adet</strong> bilet satın aldı!`;
      } else {
        noticeMarkup = `<strong>${randomName}</strong> purchased <strong>${randomQty} ticket${randomQty > 1 ? 's' : ''}</strong> for ${months} ${randomDay}!`;
      }

      let toastContainer = document.getElementById('live-toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.id = 'live-toast-container';
        toastContainer.className = 'fixed bottom-4 left-4 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 md:px-0';
        document.body.appendChild(toastContainer);
      }

      const toast = document.createElement('div');
      toast.className = 'animate-slide-up pointer-events-auto bg-charcoal/95 border border-gold/30 rounded-xl p-4 shadow-2xl flex items-center gap-3 text-sm text-gray-200 backdrop-blur-md';
      toast.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-gold/10 text-gold flex items-center justify-center shrink-0">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
        </div>
        <div class="flex-1">${noticeMarkup}</div>
      `;
      toastContainer.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';
        setTimeout(() => toast.remove(), 500);
      }, 5500);
    }

    document.getElementById('discount-apply-btn').onclick = () => {
      const input = document.getElementById('discount-input').value.trim();
      const msgDiv = document.getElementById('discount-msg');
      
      if (!input) {
        activeDiscount = { code: "", rate: 0 };
        msgDiv.classList.add('hidden');
        updateSummary();
        return;
      }
      
      msgDiv.className = "text-xs mt-1 text-gold";
      msgDiv.textContent = lang === 'tr' ? "Kontrol ediliyor..." : "Checking...";
      msgDiv.classList.remove('hidden');
      
      fetch(`${APPS_SCRIPT_URL}?action=validate_discount&code=${encodeURIComponent(input)}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.valid) {
            activeDiscount = { code: input, rate: data.rate };
            msgDiv.className = "text-xs mt-1 text-green-400";
            msgDiv.textContent = `${i18n[lang].discount_valid_msg} (-%${data.rate})`;
          } else {
            activeDiscount = { code: "", rate: 0 };
            msgDiv.className = "text-xs mt-1 text-red-400";
            msgDiv.textContent = i18n[lang].discount_invalid;
          }
          updateSummary();
        })
        .catch(() => {
          activeDiscount = { code: "", rate: 0 };
          msgDiv.className = "text-xs mt-1 text-red-400";
          msgDiv.textContent = "Error!";
          updateSummary();
        });
    };

    document.getElementById('qty-minus').onclick = () => { if(quantity > 1) { quantity--; updateSummary(); } };
    document.getElementById('qty-plus').onclick = () => { quantity++; updateSummary(); };
    document.getElementById('proceed-btn').onclick = () => document.getElementById('checkout-modal').classList.remove('hidden');
    document.getElementById('close-checkout').onclick = () => document.getElementById('checkout-modal').classList.add('hidden');
    document.getElementById('lang-toggle').onclick = () => { lang = lang === 'tr' ? 'en' : 'tr'; applyLang(); };
    
    document.getElementById('checkout-form').onsubmit = function(e) {
      e.preventDefault();
      const btn = document.getElementById('pay-submit-btn');
      btn.disabled = true;
      btn.textContent = i18n[lang].processing;
      
      const payload = {
        action: "initiate_payment",
        day: selectedDay,
        qty: quantity,
        firstName: document.getElementById('cust-first-name').value,
        lastName: document.getElementById('cust-last-name').value,
        email: document.getElementById('cust-email').value,
        phone: document.getElementById('cust-phone').value,
        country: document.getElementById('cust-country').value,
        discountCode: activeDiscount.code
      };
      
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "success" && response.paymentUrl) {
          window.location.href = response.paymentUrl;
        } else if (response.status === "sold_out") {
          alert(i18n[lang].sold_out_msg);
          location.reload();
        } else {
          alert("Iyzico Error: " + response.message);
          btn.disabled = false;
          btn.textContent = i18n[lang].proceed_payment;
        }
      })
      .catch(err => {
        console.error(err);
        alert("Bağlantı hatası oluştu.");
        btn.disabled = false;
        btn.textContent = i18n[lang].proceed_payment;
      });
    };

    applyLang();
    fetchCapacities();
    initLiveNotifications();
    lucide.createIcons();
  </script>
</body>
</html>
