  <script>
    const defaultConfig = {
      main_title: 'ANATOLIAN WARRIORS',
      tagline: 'Coming soon to Türkiye',
      cta_text: 'Stay tuned.',
      primary_color: '#dc2626',
      background_color: '#0a0a0a',
      text_color: '#d1d5db',
      accent_color: '#fecaca',
      secondary_color: '#1f2937'
    };
    
    // Progress counter animation
    let progressValue = 0;
    const progressText = document.getElementById('progress-text');
    const targetProgress = 92;
    
    function animateProgress() {
      if (progressValue < targetProgress) {
        progressValue += 1;
        if (progressText) {
          progressText.textContent = progressValue + '%';
        }
        const delay = progressValue < 20 ? 30 : progressValue < 50 ? 50 : progressValue < 80 ? 70 : 100;
        setTimeout(animateProgress, delay);
      }
    }
    
    setTimeout(animateProgress, 800);
    
    async function onConfigChange(config) {
      const mainTitle = document.getElementById('main-title');
      const tagline = document.getElementById('tagline');
      const ctaText = document.getElementById('cta-text');
      
      if (mainTitle) {
        mainTitle.textContent = config.main_title || defaultConfig.main_title;
      }
      if (tagline) {
        tagline.textContent = config.tagline || defaultConfig.tagline;
      }
      if (ctaText) {
        ctaText.textContent = config.cta_text || defaultConfig.cta_text;
      }
    }
    
    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => config.primary_color || defaultConfig.primary_color,
            set: (value) => { config.primary_color = value; window.elementSdk.setConfig({ primary_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => { config.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: undefined
      };
    }
    
    function mapToEditPanelValues(config) {
      return new Map([
        ['main_title', config.main_title || defaultConfig.main_title],
        ['tagline', config.tagline || defaultConfig.tagline],
        ['cta_text', config.cta_text || defaultConfig.cta_text]
      ]);
    }
    
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
