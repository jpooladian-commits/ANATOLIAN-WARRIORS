  <style>
    html, body {
      height: 100%;
    }

    body {
      box-sizing: border-box;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .font-bebas { font-family: 'Bebas Neue', sans-serif; }
    .font-rajdhani { font-family: 'Rajdhani', sans-serif; }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(220, 38, 38, 0.6), 0 0 40px rgba(220, 38, 38, 0.3);
      }
      50% {
        box-shadow: 0 0 30px rgba(220, 38, 38, 0.8), 0 0 60px rgba(220, 38, 38, 0.5);
      }
    }

    @keyframes loading-progress {
      0% { width: 0%; }
      20% { width: 25%; }
      40% { width: 45%; }
      60% { width: 65%; }
      80% { width: 85%; }
      100% { width: 92%; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes prize-soft-glow {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(248, 113, 113, 0.25) inset,
          0 0 30px rgba(220, 38, 38, 0.28),
          0 0 70px rgba(220, 38, 38, 0.18);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(248, 113, 113, 0.35) inset,
          0 0 45px rgba(239, 68, 68, 0.36),
          0 0 95px rgba(239, 68, 68, 0.22);
      }
    }

    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .animate-loading { animation: loading-progress 4s ease-out forwards; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-slide-up { animation: slide-up 0.8s ease-out forwards; }

    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 1.5s infinite;
    }

    .text-gradient {
      background: linear-gradient(135deg, #ffffff 0%, #fecaca 50%, #dc2626 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bg-pattern {
      background-image:
        radial-gradient(circle at 20% 80%, rgba(220, 38, 38, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(220, 38, 38, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(30, 30, 30, 1) 0%, rgba(10, 10, 10, 1) 100%);
    }

    #main-title {
      margin: 4px 0;
      line-height: 0.9;
      transform-origin: center top;
      transform: scale(var(--title-scale, 1));
      will-change: transform;
      font-size: clamp(56px, 10vw, 105px);
      letter-spacing: 0.08em;
    }

    @keyframes org-fade-up {
      0%   { opacity: 0; transform: translateY(10px); }
      18%  { opacity: .88; transform: translateY(0px); }
      72%  { opacity: .88; transform: translateY(-6px); }
      100% { opacity: 0; transform: translateY(-18px); }
    }

    .org-ticker {
      width: 100%;
      max-width: 26rem;
      height: 28px;
      overflow: hidden;
      position: relative;
      margin: 14px auto 0 auto;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.18);
      border-radius: 9999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .org-ticker::before,
    .org-ticker::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 6px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.65;
    }

    .org-ticker::before {
      top: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
    }

    .org-ticker::after {
      bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    }

    .org-line {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      text-align: center;
      z-index: 2;
      animation: org-fade-up 2.6s ease-in-out forwards;
      will-change: transform, opacity;
    }

    .org-label {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(209,213,219,0.55);
      margin-right: 10px;
      white-space: nowrap;
    }

    .org-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: rgba(248,250,252,0.90);
      white-space: nowrap;
    }

    @media (max-width: 420px) {
      .org-label { display: none; }
      .org-text { font-size: 12px; }
      .org-ticker { max-width: 22rem; }
    }

    .quick-actions {
      width: 100%;
      max-width: 26rem;
      margin: 12px auto 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .qa-btn {
      width: 100%;
      min-width: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(0,0,0,0.18);
      color: rgba(248,250,252,0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform .2s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
      text-decoration: none;
      text-align: center;
    }

    .qa-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(239, 68, 68, 0.7);
      background: rgba(220,38,38,0.18);
    }

    .qa-text {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .05em;
      text-transform: uppercase;
      white-space: nowrap;
      line-height: 1;
    }

    .prize-card {
      position: relative;
      width: 100%;
      max-width: 26rem;
      margin: 4px auto 0 auto;
      padding: 18px 18px 16px;
      border-radius: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.06) 0%, rgba(15, 23, 42, 0) 55%),
        linear-gradient(180deg, rgba(18, 28, 52, 0.98) 0%, rgba(17, 24, 39, 0.98) 100%);
      border: 1px solid rgba(248, 113, 113, 0.3);
      animation: prize-soft-glow 2.6s ease-in-out infinite;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .prize-card::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.18) 0%, rgba(239, 68, 68, 0) 65%);
      z-index: 0;
      pointer-events: none;
    }

    .prize-card:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(252, 165, 165, 0.5);
    }

    .prize-card > * {
      position: relative;
      z-index: 1;
    }

    .prize-icon {
      font-size: 30px;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.28));
    }

    .prize-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(203, 213, 225, 0.86);

    .prize-amount {

      color: #ff5a5f;
      text-shadow:

    }

    .prize-note {
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(226, 232, 240, 0.72);
      letter-spacing: .04em;
    }

    @media (min-width: 768px) {
      .quick-actions {
        max-width: 46rem;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .qa-btn {
        padding: 18px 18px;
        border-radius: 16px;
        min-height: 62px;

      .qa-text {
        font-size: 15px;
        letter-spacing: .06em;
      }

      .prize-card {
        max-width: 46rem;
        padding: 24px 20px 20px;
        border-radius: 20px;
      }

      .prize-icon {
        font-size: 34px;
      }

      .prize-label {
        font-size: 14px;
      }
    }
  </style>

    @view-transition { navigation: auto; }
  </style>
</head>

  <script>
    const defaultConfig = {
      main_title: 'ANATOLIAN WARRIORS',
      tagline: 'Türkiye Atletizm Federasyonu aracılığıyla resmî kayıt başladı.',
      cta_text: '🏆 YARIŞMA KURALLARI',
      primary_color: '#dc2626',
      background_color: '#0a0a0a',
      text_color: '#d1d5db',
      accent_color: '#fecaca',
      secondary_color: '#1f2937'
    };

    let progressValue = 0;
    const progressText = document.getElementById('progress-text');
    const targetProgress = 92;

    function animateProgress() {
      if (progressValue < targetProgress) {
        progressValue += 1;
        if (progressText) progressText.textContent = progressValue + '%';
        const delay = progressValue < 20 ? 30 : progressValue < 50 ? 50 : progressValue < 80 ? 70 : 100;
        setTimeout(animateProgress, delay);
      }
    }

    setTimeout(animateProgress, 800);

    function fitTitle() {
      const el = document.getElementById('main-title');
      if (!el) return;

      el.style.setProperty('--title-scale', 1);

      const maxW = Math.max(320, window.innerWidth - 32);
      const rect = el.getBoundingClientRect();

      if (rect.width > maxW) {
        const scale = Math.max(0.72, maxW / rect.width);
        el.style.setProperty('--title-scale', scale.toFixed(3));
      }
    }

    async function onConfigChange(config) {
      const mainTitle = document.getElementById('main-title');
      const tagline = document.getElementById('tagline');
      const ctaText = document.getElementById('cta-text');

      if (mainTitle) mainTitle.textContent = config.main_title || defaultConfig.main_title;
      if (tagline) tagline.textContent = config.tagline || defaultConfig.tagline;
      if (ctaText) ctaText.textContent = config.cta_text || defaultConfig.cta_text;

      setTimeout(fitTitle, 30);
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.primary_color || defaultConfig.primary_color,
            set: (value) => {
              config.primary_color = value;
              window.elementSdk.setConfig({ primary_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ['main_title', config.main_title || defaultConfig.main_title],
        ['tagline', config.tagline || defaultConfig.tagline],
        ['cta_text', config.cta_text || defaultConfig.cta_text]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }

    (function initOrgTicker() {
      const ORGS = [
        'Türkiye Atletizm Federasyonu',
        'T.C. Gençlik ve Spor Bakanlığı (İstanbul)',
        'İstanbul Büyükşehir Belediyesi',
        'İstanbul Valiliği'
      ];

      const textEl = document.getElementById('org-text');
      const lineEl = document.getElementById('org-line');

      if (!textEl || !lineEl) return;

      let idx = 0;

      function showNext() {
        lineEl.style.animation = 'none';
        void lineEl.offsetHeight;
        textEl.textContent = ORGS[idx % ORGS.length];
        lineEl.style.animation = '';
        idx++;
      }

      showNext();
      setInterval(showNext, 2600);
    })();

    window.addEventListener('resize', fitTitle, { passive: true });

    document.addEventListener('DOMContentLoaded', () => {
      fitTitle();
      setTimeout(fitTitle, 250);
      setTimeout(fitTitle, 800);
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        fitTitle();
        setTimeout(fitTitle, 150);
      });
    }
  </script>
