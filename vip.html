<!doctype html>
<html lang="tr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatolian Warriors - VIP Partner Giriş Paneli</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: '#D4AF37', 'gold-dark': '#B8960C', obsidian: '#0A0A0A', charcoal: '#1A1A1A', slate: '#2A2A2A' },
          fontFamily: { oswald: ['Oswald', 'sans-serif'], barlow: ['Barlow', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 70%); min-height: 100vh; }
    .panel-card { background-color: rgba(26, 26, 26, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.15); }
  </style>
</head>
<body class="text-white font-barlow flex flex-col justify-between h-full">

  <header class="w-full bg-obsidian/90 border-b border-gold/10 px-6 py-4 flex items-center justify-between">
    <a href="/"><div class="font-oswald text-xl font-bold tracking-wider">
      <span class="text-gold">ANATOLIAN</span> WARRIORS <span class="text-xs text-gray-400 block md:inline md:ml-2">| VIP Partner PANELİ</span>
    </div> </a>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-xl">
      
      <div id="auth-card" class="panel-card rounded-2xl p-6 md:p-8 shadow-2xl">
        <div class="text-center mb-6">
          <i data-lucide="shield-check" class="w-12 h-12 text-gold mx-auto mb-2"></i>
          <h2 class="font-oswald text-2xl font-bold tracking-wide">VIP Partner Girişi</h2>
        </div>

        <form id="partner-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1 tracking-wider">İNDİRİM KODU (CODE)</label>
            <input type="text" id="promo-code" placeholder="Örn: 52486" required class="w-full bg-slate/50 border border-gray-600 rounded-lg px-4 py-3 text-white font-mono uppercase focus:border-gold focus:outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1 tracking-wider">USER TOKEN</label>
            <input type="password" id="user-token" placeholder="Token değerinizi girin" required class="w-full bg-slate/50 border border-gray-600 rounded-lg px-4 py-3 text-white font-mono focus:border-gold focus:outline-none transition">
          </div>
          <button type="submit" id="submit-btn" class="w-full py-3.5 bg-gradient-to-r from-gold to-gold-dark text-obsidian font-oswald text-base font-bold rounded-lg tracking-wider hover:opacity-90 active:scale-[0.99] transition mt-6 flex items-center justify-center gap-2">
            <i data-lucide="bar-chart-3" class="w-5 h-5"></i> VERİLERİ GETİR
          </button>
        </form>
      </div>

      <div id="stats-card" class="hidden panel-card rounded-2xl p-6 md:p-8 shadow-2xl relative border border-gold/30">
        <button id="back-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white flex items-center gap-1 text-xs bg-slate/50 px-3 py-1 rounded border border-gray-700 transition">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Çıkış Yap
        </button>

        <div class="border-b border-gold/10 pb-4 mb-6">
          <span class="text-xs text-gold uppercase tracking-widest font-semibold">Sorgulanan Kod</span>
          <h3 id="display-code" class="font-oswald text-3xl font-bold tracking-wide text-white font-mono mt-1">—</h3>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-obsidian/40 border border-gray-800 rounded-xl p-4 flex items-center gap-4">
            <div class="p-3 bg-gold/10 rounded-lg text-gold"><i data-lucide="ticket" class="w-6 h-6"></i></div>
            <div>
              <span class="text-xs text-gray-400 block uppercase">Satılan Toplam Bilet</span>
              <span id="stat-tickets" class="font-oswald text-3xl font-bold text-white">0</span>
            </div>
          </div>
          <div class="bg-obsidian/40 border border-gray-800 rounded-xl p-4 flex items-center gap-4">
            <div class="p-3 bg-green-500/10 rounded-lg text-green-400"><i data-lucide="badge-dollar-sign" class="w-6 h-6"></i></div>
            <div>
              <span class="text-xs text-gray-400 block uppercase">Toplam Hasılat</span>
              <span id="stat-revenue" class="font-oswald text-2xl font-bold text-green-400">0,00 ₺</span>
            </div>
          </div>
        </div>

        <div class="mt-6 p-5 bg-black/40 border border-gray-800 rounded-xl">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Mevcut VIP Seviyesi</span>
            <span id="tier-badge" class="px-3 py-1 rounded-md text-xs font-bold tracking-widest uppercase border">
              -
            </span>
          </div>

          <div class="mb-4 text-sm bg-slate/30 p-2.5 rounded border border-gray-800/50 flex justify-between items-center">
            <span class="text-gray-400 text-xs uppercase">Güncel Komisyon Oranı:</span>
            <span id="tier-commission" class="font-oswald font-bold text-base text-gold">—</span>
          </div>
          
          <div class="mb-5">
            <div class="flex justify-between text-xs text-gray-400 mb-1.5">
              <span id="next-tier-info">—</span>
              <span id="progress-percent" class="font-mono text-gold">0%</span>
            </div>
            <div class="w-full bg-slate/60 h-2.5 rounded-full overflow-hidden border border-gray-900">
              <div id="progress-bar" class="bg-gradient-to-r from-gold to-gold-dark h-full transition-all duration-700 ease-out" style="width: 0%"></div>
            </div>
          </div>

          <div>
            <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold block mb-3 border-b border-gray-800 pb-1">Seviye Ayrıcalıkları</span>
            <ul id="perks-list" class="space-y-2 text-xs">
              </ul>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="w-full text-center py-4 text-xs text-gray-600 border-t border-gray-900 bg-obsidian/40">
    &copy; 2026 Anatolian Warriors. Partner Tracking System.
  </footer>

  <script>
    const MARKETING_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx68IBA0UU2t94oSMxWZNOn1Q1tK9b9DwwbDHk4qq5lEiEVxU2IOnql8JvZQAPKFJlS/exec";

    document.getElementById('partner-form').onsubmit = function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submit-btn');
      const promoCode = document.getElementById('promo-code').value.trim();
      const userToken = document.getElementById('user-token').value.trim();

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Yükleniyor...`;
      lucide.createIcons();

      const queryUrl = `${MARKETING_SCRIPT_URL}?action=get_affiliate_stats&promoCode=${encodeURIComponent(promoCode)}&userToken=${encodeURIComponent(userToken)}`;

      fetch(queryUrl)
        .then(res => {
          if (!res.ok) throw new Error("Network error");
          return res.json();
        })
        .then(response => {
          if (response.status === "success") {
            document.getElementById('display-code').textContent = response.promoCode;
            document.getElementById('stat-tickets').textContent = response.totalTickets;
            document.getElementById('stat-revenue').textContent = response.totalRevenue;

            // VIP Seviye Hesaplama Mantığı
            updateVIPTierSystem(parseInt(response.totalTickets) || 0);

            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('stats-card').classList.remove('hidden');
          } else {
            alert("Doğrulama Hatası: " + response.message);
          }
        })
        .catch(err => {
          console.error(err);
          alert("Sorgulama başarısız oldu!\n\nLütfen internet bağlantısını ve Google Web-App ayarlarını kontrol edin.");
        })
        .finally(() => {
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="bar-chart-3" class="w-5 h-5"></i> VERİLERİ GETİR`;
          lucide.createIcons();
        });
    };

    function updateVIPTierSystem(tickets) {
      let tierName = "";
      let tierBadgeClass = "";
      let commissionText = "";
      let nextTierText = "";
      let progressPercent = 0;
      let perks = [];

      if (tickets >= 1000) {
        tierName = "HAKAN (Seviye 3)";
        tierBadgeClass = "bg-purple-500/20 border-purple-500/50 text-purple-400 animate-pulse";
        commissionText = "SÜRPRİZ ÖZEL ANLAŞMA 🎁";
        nextTierText = "En Üst Seviyeye Ulaştınız!";
        progressPercent = 100;
        perks = [
          "Özel Komisyon Oranı & Kar Payı Ortaklığı",
          "Özel Yapım Fiziksel Kılıç Veya Şampiyonluk Kemeri",
          "Ömür Boyu Tüm Etkinliklere VIP Black Card Giriş Hakkı",
          "Kurucular ve Dövüşçülerle Özel Akşam Yemeği",
          "Tam Sponsorlu Seyahat ve Konaklama Paketi"
        ];
      } else if (tickets >= 100) {
        tierName = "BEY (Seviye 2)";
        tierBadgeClass = "bg-gold/20 border-gold/50 text-gold";
        commissionText = "%10";
        progressPercent = ((tickets - 100) / (1000 - 100)) * 100;
        nextTierText = `HAKAN seviyesine ${1000 - tickets} bilet kaldı`;
        perks = [
          "%10 Komisyon Oranı",
          "Sahne Arkası (Backstage Pass) ve VIP Koltuk Hakkı",
          "Partnerler İçin Hızlı Destek Hattı",
          "Sosyal Medya ve Web Sitemizde Resmi Tanıtım"
        ];
      } else if (tickets >= 50) {
        tierName = "ALP (Seviye 1)";
        tierBadgeClass = "bg-cyan-500/20 border-cyan-500/50 text-cyan-400";
        commissionText = "%5";
        progressPercent = ((tickets - 50) / (100 - 50)) * 100;
        nextTierText = `BEY seviyesine ${100 - tickets} bilet kaldı`;
        perks = [
          "%5 Komisyon Oranı",
          "Dijital Başarı ve Teşekkür Sertifikası",
          "Özel VIP Partner Topluluk Grubuna Katılım",
          "Etkinlik İçin 1 Adet Ücretsiz Standart Bilet"
        ];
      } else {
        tierName = "STANDART PARTNER";
        tierBadgeClass = "bg-gray-500/10 border-gray-500/30 text-gray-400";
        commissionText = "%0";
        progressPercent = (tickets / 50) * 100;
        nextTierText = `ALP seviyesine ${50 - tickets} bilet kaldı`;
        perks = [
          "VIP avantajları ve komisyon kazanmak için en az 50 bilet satmalısınız."
        ];
      }

      // UI Güncelleme
      const badge = document.getElementById('tier-badge');
      badge.textContent = tierName;
      badge.className = `px-3 py-1 rounded-md text-xs font-bold tracking-widest uppercase border ${tierBadgeClass}`;

      document.getElementById('tier-commission').textContent = commissionText;
      document.getElementById('next-tier-info').textContent = nextTierText;
      document.getElementById('progress-percent').textContent = `${Math.min(100, Math.max(0, Math.round(progressPercent)))}%`;
      document.getElementById('progress-bar').style.width = `${Math.min(100, Math.max(0, progressPercent))}%`;

      const listContainer = document.getElementById('perks-list');
      listContainer.innerHTML = '';
      perks.forEach(perk => {
        const li = document.createElement('li');
        li.className = "flex items-start gap-2 text-gray-300 line-height-relaxed";
        li.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 text-gold flex-shrink-0 mt-0.5"></i> <span>${perk}</span>`;
        listContainer.appendChild(li);
      });

      lucide.createIcons();
    }

    document.getElementById('back-btn').onclick = function() {
      document.getElementById('user-token').value = "";
      document.getElementById('stats-card').classList.add('hidden');
      document.getElementById('auth-card').classList.remove('hidden');
    };

    lucide.createIcons();
  </script>
</body>
</html>
